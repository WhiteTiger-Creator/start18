name = "reservoir-release-scheduler"

[metadata]
author_name = "Jonathan"
author_email = "jtolbert0175@gmail.com"
difficulty_explanation = '''Restoring this release schedule is the work of a basin operations or water-resources engineer picking up after a botched telemetry migration, and it is a dependent chain rather than a single repair. All of the data is synthetic: the reservoirs, gauges, water rights, holders and the board minutes were generated for this task and describe no real basin, district or person. The migration left /app/data/gauge_readings.json holding a truncated prefix of the series, so the first step is to rebuild it by replaying the telemetry journal onto the pre-migration snapshot under the board's final recovery decision -- each change keyed on the reading it names, an amendment overwriting a field in place, a retraction taking a reading out while the office keeps it as it then stood, and a restoration returning exactly that held state so an amendment posted while the reading was out is lost -- and then bringing every surviving reading onto the basin datum, a signed per-sensor correction that is ADDED to the raw stage rather than subtracted. Which readings survive and what each one is worth decides the inflow of every reservoir-day, so every allocation decision rests on it. Only then can the operating dialect be reconstructed, and the minute book is written the way a basin board actually writes: it records where the board departed from the intuitive reading and never restates what a priority date, an environmental minimum or a flood release means. Three February drafts were reversed in the May operations review and two March interims were revised, so every rule must be traced to its FINAL dated decision: a suspect reading carries ZERO inflow while its day is still scheduled rather than dropping out, the appropriations are served in strict priority order with juniors going short rather than the shortage being prorated, the environmental minimum is served BEFORE any appropriation rather than out of the remainder, and the flood release is sized on the storage as it stands after the day's inflow rather than on the opening storage. Those four interact through one shared outlet limit and one shared live pool: the suspect rule decides the inflow, the flood rule takes its cut of the outlet ahead of the rights, the environmental minimum is taken off before either, and the priority order then decides which rights get what is left -- so a wrong rule anywhere changes not merely a volume but which right appears in the curtailment record at all, and the record is capped, so it also changes which curtailments are written down.'''
solution_explanation = '''solution/solve.sh drives the two dependent steps inside the environment container. Step one runs solution/recover_gauges.go, which implements the board's final recovery decisions (#BAS-8170, #BAS-8174 and #BAS-8178): it starts from /app/data/gauge_snapshot_pre_migration.json, replays /app/data/telemetry_journal.json in ascending seq keyed on reading id, applies an amendment in place, holds a retracted reading aside as it then stood, returns exactly that held state on a restoration, ignores a change naming an unknown reading, adds the sensor family's signed datum offset to the raw stage and floors the result at zero, and writes the survivors over the truncated /app/data/gauge_readings.json ascending by reservoir, day and reading id. Step two copies solution/schedule_releases_fixed.go over /app/workflow/schedule_releases.go and runs it. The scheduler carries a suspect reading as zero inflow while still scheduling its day (#BAS-8182), serves the environmental minimum ahead of every appropriation out of the outlet and the live pool (#BAS-8190), sizes the flood release on the post-inflow post-environmental storage above the flood pool and gives it precedence over the rights for the remaining outlet (#BAS-8194), serves the appropriations in strict priority-year then right-id order without prorating (#BAS-8186), raises one curtailment record per short right and reasons it flood_operation where the day flooded and the right is junior to the policy year, otherwise supply_short (#BAS-8196), and holds every release inside the outlet limit and the live pool while emitting the schedule by reservoir and day and the capped queue by day, reservoir and right id (#BAS-8198).'''
verification_explanation = '''The separate verifier (tests/Dockerfile builds an isolated image the agent cannot see) collects the agent's whole /app as the declared artifact and runs tests/test_outputs.py against it. Step one is graded directly: the rebuilt series must match the sealed digest and reading count, carry only the seven declared fields with no migrator bookkeeping surviving, hold corrected stages consistent with the datum table in the additive direction, and leave the snapshot, journal, datum table, registers and policy byte-identical. The verifier re-derives the misreadings of the replay from those same sources -- a plain concatenation, a replay in file order rather than by sequence, one where a restoration re-reads the snapshot instead of the held state, and one that subtracts the datum offset -- and requires each to differ from the governed result. Step two recompiles the agent's submitted /app/workflow/schedule_releases.go from source with go build rather than trusting any delivered binary, runs it under an unprivileged uid (65534 via setpriv, a scrubbed environment, inputs staged into a candidate-writable work area) on both the recovered series and a held-out alternate series, and compares summary.json in full plus SHA-256 digests of release_schedule.json and curtailment_queue.jsonl against sealed fixtures generated from the reference. Crafted micro-instances pin each reversed rule independently: one proves a suspect reading contributes nothing while its day is still scheduled and still owes its environmental minimum, one proves a senior right is served in full while a junior goes without rather than both being prorated, one proves the environmental minimum is taken ahead of a right that would otherwise absorb the whole outlet, and one proves the flood release is sized on the post-inflow storage rather than the opening storage. The contract publishes a ninety-second budget as guidance on the scale a run is expected to handle; the verifier bounds its own run rather than timing this one, so no assertion turns on how long the grading machine took. The frozen snapshot /app/workflow/.schedule_releases.original.go is asserted present by hash and wrong by output. Confirmed locally in the real two-container flow: after solve.sh the verifier gives reward 1, a fresh environment with no solve.sh gives 0, and so does an environment where the scheduler is repaired but the gauge series is never rebuilt.'''
relevant_experience = '''Working knowledge of reservoir operations as a discipline -- prior-appropriation water rights and priority dates, environmental minimum flows, flood pools and outlet capacity, dead storage and curtailment taken as read rather than looked up -- plus experience rebuilding a gauge record by replaying a migration journal onto a snapshot and correcting it onto a common datum, and reconstructing an operating dialect from an authoritative but noisy board minute book that records only its departures from the intuitive reading, tracing incrementally-revised rules to their final form and matching a strict output contract in Go.'''
